<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="taupeTerracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EBDD"/>
      <stop offset="50%" stop-color="#B69B7D"/>
      <stop offset="100%" stop-color="#C87552"/>
    </linearGradient>
    <linearGradient id="espressoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30231F"/>
      <stop offset="100%" stop-color="#221815"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="94" fill="url(#espressoGrad)" stroke="url(#taupeTerracottaGrad)" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#B69B7D" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.65"/>
  
  <!-- Faceted Resin Crystal Silhouette -->
  <polygon points="100,28 148,65 130,126 100,165 70,126 52,65" fill="none" stroke="url(#taupeTerracottaGrad)" stroke-width="2" opacity="0.45"/>
  <polygon points="100,38 138,70 124,120 100,150 76,120 62,70" fill="none" stroke="url(#taupeTerracottaGrad)" stroke-width="1.5" opacity="0.72"/>
  <polygon points="100,50 128,75 118,112 100,135 82,112 72,75" fill="rgba(200, 117, 82, 0.14)" stroke="url(#taupeTerracottaGrad)" stroke-width="1.8"/>

  <!-- Center 'RCH' Monogram -->
  <text x="100" y="106" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="700" fill="#F4EBDD" text-anchor="middle" letter-spacing="2">RCH</text>
  <text x="100" y="132" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6.8" font-weight="600" fill="#B69B7D" text-anchor="middle" letter-spacing="1.8">ROHAN CRAFT HOUSE</text>
</svg>

